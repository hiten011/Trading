name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, hermetic-by-default unit suite (no Docker, no real market data).
  # secrets/.env.dev is committed to this repo (see that file for why), so
  # the checkout already has real credentials -- no GitHub Actions secrets
  # to configure. That also means the two live-Telegram tests in here send a
  # real message on every push/PR, not just a local `make test`.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run the test suite
        run: make test

  # Confirms the Dockerfile still builds against upstream's current
  # pkjmesra/pkscreener:latest, and that the built image actually runs --
  # a hermetic pytest run can't catch either of those breaking.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the alerts image
        run: docker compose build alerts

      - name: Smoke-test the built image
        run: docker run --rm trading/pkscreener-alerts:latest --list-strategies

      - name: Live Telegram check through the real container
        run: |
          docker run --rm -v "$(pwd)/secrets/.env.dev:/PKScreener-main/.env.dev:ro" \
            trading/pkscreener-alerts:latest --check-telegram

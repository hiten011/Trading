# =============================================================================
# PKScreener + custom Telegram alerts
# =============================================================================
#   docker compose run --rm screener        one-shot scan, results to terminal
#   docker compose up -d alerts             your own indicator, on a schedule
#   docker compose --profile bot up -d bot  PKScreener's Telegram bot server
#   docker compose up -d oi-scanner        F&O open-interest blast alerts
#
# Secrets come from secrets/.env.dev (mounted read-only).
# Knobs come from .env (see .env.example).
# =============================================================================

x-pkscreener-common: &pkscreener-common
  image: ${PKSCREENER_IMAGE:-pkjmesra/pkscreener}:${PKSCREENER_TAG:-latest}
  environment:
    TZ: ${TZ:-Asia/Kolkata}
    PKSCREENER_DOCKER: "1"
    GIT_PYTHON_REFRESH: quiet
    TERM: xterm
    # PKScreener gates first-run usage behind an interactive OTP login
    # (PKUserRegistration) unless this is set -- it's the same env var
    # upstream's own GitHub Actions workflows use to run headlessly, and it
    # also unblocks their internal Telegram delivery and cache-writing paths
    # that are otherwise conditional on "am I a human at a keyboard". None of
    # our containers have a human at a keyboard, so this is always on.
    RUNNER: GitHub_Actions
  volumes:
    # PKScreener reads secrets from ./.env.dev relative to its working dir.
    - ./secrets/.env.dev:/PKScreener-main/.env.dev:ro
    # Its tunable filters (min/max price, volume ratio, lookback...).
    # Read-write: PKScreener writes its own state back into this file
    # (appversion, tosaccepted) after a run. That's expected -- harmless
    # drift, not something to chase down. Mounting it read-only instead
    # makes PKScreener's own config-repair path (IOError -> sys.exit(1))
    # a hard failure, which is worse.
    - ./config/pkscreener.ini:/PKScreener-main/pkscreener.ini
    # Downloaded candles + generated reports. Keeping this on the host means
    # a scan does not re-download the whole market every time.
    - ./data/results:/PKScreener-main/results
    # Where `pkscreenercli.py -d` (download-only mode) puts its pickle instead.
    - ./data/actions-data-download:/PKScreener-main/actions-data-download
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # One-shot scan using PKScreener's own scanners.
  #   docker compose run --rm screener
  #   docker compose run --rm screener -a Y -e -o X:12:9   (override the menu)
  # ---------------------------------------------------------------------------
  screener:
    <<: *pkscreener-common
    container_name: pkscreener-scan
    profiles: ["manual"]
    stdin_open: true
    tty: true
    # -a Y : answer defaults (also accepts PKScreener's terms of service)
    # -e   : exit after one run instead of looping
    # -o   : menu path, e.g. X:12:23 = Scanners / Nifty (All Stocks) / Breaking out now
    command: ["-a", "Y", "-e", "-o", "${SCAN_OPTIONS:-X:12:23}"]

  # ---------------------------------------------------------------------------
  # PKScreener's interactive Telegram bot server (their "server").
  # Long-running: answers /commands in Telegram and runs scans on demand.
  # Needs TOKEN + CHAT_ID in secrets/.env.dev.
  # ---------------------------------------------------------------------------
  bot:
    <<: *pkscreener-common
    container_name: pkscreener-bot
    profiles: ["bot"]
    restart: unless-stopped
    command: ["--bot", "-a", "Y", "-p"]

  # ---------------------------------------------------------------------------
  # OUR custom indicator -> Telegram alert.
  # Edit custom/strategies/my_indicator.py, then:
  #   docker compose run --rm alerts --once --dry-run   (test, no telegram)
  #   docker compose up -d alerts                        (run on schedule)
  #
  # In --schedule mode (the default CMD, what `up -d` runs) this container
  # refreshes its own market-data cache periodically -- see PKS_AUTO_REFRESH_DATA
  # below and custom/datarefresh.py. That's what makes `docker compose up -d
  # alerts` a real "deploy once, forget about it" story on a server: no
  # external cron re-running `make data`, no separate always-on data-refresh
  # container to babysit.
  # ---------------------------------------------------------------------------
  alerts:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PKSCREENER_IMAGE: ${PKSCREENER_IMAGE:-pkjmesra/pkscreener}
        PKSCREENER_TAG: ${PKSCREENER_TAG:-latest}
    image: trading/pkscreener-alerts:latest
    container_name: pkscreener-alerts
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PKSCREENER_DOCKER: "1"
      GIT_PYTHON_REFRESH: quiet
      # See the comment on RUNNER in x-pkscreener-common -- applies here too
      # since custom.universe can fall back to PKScreener's own fetcher.
      RUNNER: GitHub_Actions
      PYTHONPATH: /app
      PKS_DATA_DIR: /PKScreener-main/results/Data:/PKScreener-main/actions-data-download
      PKS_UNIVERSE: ${PKS_UNIVERSE:-auto}
      PKS_INDEX_OPTION: ${PKS_INDEX_OPTION:-12}
      PKS_LOOKBACK_DAYS: ${PKS_LOOKBACK_DAYS:-250}
      PKS_AUTO_REFRESH_DATA: ${PKS_AUTO_REFRESH_DATA:-1}
      PKS_DATA_MAX_AGE_HOURS: ${PKS_DATA_MAX_AGE_HOURS:-20}
      PKS_MIN_PRICE: ${PKS_MIN_PRICE:-20}
      PKS_MAX_PRICE: ${PKS_MAX_PRICE:-100000}
      PKS_MIN_AVG_VOLUME: ${PKS_MIN_AVG_VOLUME:-100000}
      PKS_MAX_ALERTS: ${PKS_MAX_ALERTS:-40}
      PKS_RUN_AT: ${PKS_RUN_AT:-15:45}
      PKS_INTERVAL_MINUTES: ${PKS_INTERVAL_MINUTES:-0}
      PKS_TRADING_DAYS_ONLY: ${PKS_TRADING_DAYS_ONLY:-1}
      PKS_DRY_RUN: ${PKS_DRY_RUN:-0}
      PKS_NOTIFY_EMPTY: ${PKS_NOTIFY_EMPTY:-0}
      PKS_ATTACH_CSV: ${PKS_ATTACH_CSV:-1}
      PKS_STRATEGY: ${PKS_STRATEGY:-my_indicator}
      PKS_LOG_LEVEL: ${PKS_LOG_LEVEL:-INFO}
      PKS_UNIVERSE_FILE: /app/config/universe.txt
    volumes:
      - ./secrets/.env.dev:/PKScreener-main/.env.dev:ro
      - ./config/pkscreener.ini:/PKScreener-main/pkscreener.ini
      - ./data/results:/PKScreener-main/results
      - ./data/actions-data-download:/PKScreener-main/actions-data-download
      # Live-edit your indicator without rebuilding the image.
      - ./custom:/app/custom
      - ./config:/app/config:ro
    depends_on:
      data-refresh:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ---------------------------------------------------------------------------
  # F&O option open-interest blast scanner -> Telegram.
  #   docker compose run --rm oi-scanner --once --dry-run    (test, no telegram)
  #   docker compose up -d oi-scanner                        (run on schedule)
  #   docker compose run --rm oi-scanner --backtest --start 2025-01-01 --split
  #
  # Reuses the same image as `alerts` -- only the entrypoint differs -- so
  # there is one thing to build and one thing to keep up to date.
  #
  # Deliberately NOT depends_on data-refresh: this scanner reads NSE's F&O
  # bhavcopy archive directly and never touches PKScreener's candle cache, so
  # waiting on a ~20 minute full-market download would just delay startup.
  # ---------------------------------------------------------------------------
  oi-scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PKSCREENER_IMAGE: ${PKSCREENER_IMAGE:-pkjmesra/pkscreener}
        PKSCREENER_TAG: ${PKSCREENER_TAG:-latest}
    image: trading/pkscreener-alerts:latest
    container_name: fno-oi-scanner
    restart: unless-stopped
    entrypoint: ["python3", "-m", "custom.oi.cli"]
    command: ["--schedule"]
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PYTHONPATH: /app
      GIT_PYTHON_REFRESH: quiet
      # Absolute paths: the image's WORKDIR is /PKScreener-main, so anything
      # relative would land outside the mounted volume and be lost on restart.
      OI_SOURCE: ${OI_SOURCE:-bhavcopy}
      OI_CACHE_DIR: /app/data/oi_cache
      OI_STATE_DB: /app/data/oi_state.sqlite
      OI_REPORTS_DIR: /app/data/oi_reports
      OI_SYMBOLS: ${OI_SYMBOLS:-}
      OI_EXCLUDE_INDICES: ${OI_EXCLUDE_INDICES:-0}
      OI_WATCH_PCT: ${OI_WATCH_PCT:-300}
      OI_STRONG_PCT: ${OI_STRONG_PCT:-1000}
      OI_EXTREME_PCT: ${OI_EXTREME_PCT:-2000}
      OI_MIN_TIER: ${OI_MIN_TIER:-STRONG}
      OI_MIN_OI_LOTS: ${OI_MIN_OI_LOTS:-500}
      OI_MIN_PREV_OI_LOTS: ${OI_MIN_PREV_OI_LOTS:-50}
      OI_MIN_DELTA_OI_LOTS: ${OI_MIN_DELTA_OI_LOTS:-250}
      OI_MIN_VOLUME_LOTS: ${OI_MIN_VOLUME_LOTS:-100}
      OI_MIN_NOTIONAL_CR: ${OI_MIN_NOTIONAL_CR:-1}
      OI_MAX_MONEYNESS_PCT: ${OI_MAX_MONEYNESS_PCT:-10}
      OI_MIN_DTE: ${OI_MIN_DTE:-2}
      OI_MAX_DTE: ${OI_MAX_DTE:-45}
      OI_MAX_EXPIRIES: ${OI_MAX_EXPIRIES:-2}
      OI_SUPPRESS_ROLLOVER: ${OI_SUPPRESS_ROLLOVER:-1}
      OI_ROLLOVER_WINDOW_DAYS: ${OI_ROLLOVER_WINDOW_DAYS:-5}
      OI_MIN_SHARE_OF_SYMBOL_OI: ${OI_MIN_SHARE_OF_SYMBOL_OI:-0.005}
      OI_MIN_Z_SCORE: ${OI_MIN_Z_SCORE:-0}
      OI_Z_LOOKBACK: ${OI_Z_LOOKBACK:-20}
      OI_INCLUDE_NEW_CONTRACTS: ${OI_INCLUDE_NEW_CONTRACTS:-1}
      OI_REQUIRE_FUTURES_CONFIRM: ${OI_REQUIRE_FUTURES_CONFIRM:-0}
      OI_MAX_ALERTS: ${OI_MAX_ALERTS:-25}
      OI_MAX_PER_SYMBOL: ${OI_MAX_PER_SYMBOL:-3}
      OI_COOLDOWN_HOURS: ${OI_COOLDOWN_HOURS:-12}
      OI_RUN_AT: ${OI_RUN_AT:-18:30}
      OI_INTERVAL_MINUTES: ${OI_INTERVAL_MINUTES:-0}
      OI_TRADING_DAYS_ONLY: ${OI_TRADING_DAYS_ONLY:-1}
      OI_DRY_RUN: ${OI_DRY_RUN:-0}
      OI_NOTIFY_EMPTY: ${OI_NOTIFY_EMPTY:-0}
      OI_ATTACH_CSV: ${OI_ATTACH_CSV:-1}
      OI_LOG_LEVEL: ${OI_LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/.env.dev:/PKScreener-main/.env.dev:ro
      # Bhavcopy cache, de-dup state and report CSVs all live here, so an
      # upgrade or a restart never re-downloads history or replays alerts.
      - ./data:/app/data
      # Live-edit the scanner without rebuilding.
      - ./custom:/app/custom
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Populates ./data/results with the latest daily candles for every NSE stock,
  # using PKScreener's own downloader. `alerts` waits for this to finish once,
  # and the runner refreshes on its own after that.
  # ---------------------------------------------------------------------------
  data-refresh:
    <<: *pkscreener-common
    container_name: pkscreener-data
    command: ["-a", "Y", "-e", "-d"]
    restart: "no"
